[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detranspiler"
version = "1.0.0"
description = "Recover Java-like source from JNI native libraries using Ghidra, JNI tracing, and layered decompilation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Detranspiler contributors" }]
dependencies = [
  "lief>=0.14.0",
  "pefile>=2023.2.7",
  "tqdm>=4.66.0",
]
keywords = [
  "reverse-engineering",
  "jni",
  "ghidra",
  "decompiler",
  "java",
  "native",
  "jnic",
  "dll",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/0WhiteDev/detranspiler"
Documentation = "https://github.com/0WhiteDev/detranspiler#readme"
Repository = "https://github.com/0WhiteDev/detranspiler"
Issues = "https://github.com/0WhiteDev/detranspiler/issues"

[project.optional-dependencies]
gui = ["pywebview>=5.0"]

[project.scripts]
detranspiler = "detranspiler.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"detranspiler.ghidra.scripts" = ["*.java"]
"detranspiler.gui.assets" = ["*.html", "*.css", "*.js"]
"detranspiler.reporting.assets" = ["*.html", "*.js"]

[tool.setuptools.packages.find]
where = ["."]
include = ["detranspiler*"]
